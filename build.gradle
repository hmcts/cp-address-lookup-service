plugins {
  id 'application'
  id 'java'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'jacoco'
  id 'maven-publish'
  id 'com.github.ben-manes.versions' version '0.61.0'
  id 'org.cyclonedx.bom' version '3.4.1'
  id 'com.gorylenko.gradle-git-properties' version '4.0.1'
}

group = 'uk.gov.hmcts.cp'
version = System.getProperty('ARTEFACT_VERSION') ?: '0.0.999'

apply {
  from("$rootDir/gradle/repositories.gradle")
  from("$rootDir/gradle/java.gradle")
  from("$rootDir/gradle/dependency.gradle")
  from("$rootDir/gradle/pmd.gradle")
  from("$rootDir/gradle/test.gradle")
  from("$rootDir/gradle/jar.gradle")
}

// ------------ Integration test source set (WireMock-backed, no external services needed) ------------
sourceSets {
  integrationTest {
    java.srcDir 'src/integrationTest/java'
    resources.srcDir 'src/integrationTest/resources'
    compileClasspath += sourceSets.main.output + configurations.integrationTestCompileClasspath
    runtimeClasspath += sourceSets.main.output + configurations.integrationTestRuntimeClasspath
  }
}

configurations {
  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
  integrationTestCompileOnly.extendsFrom testCompileOnly
}

tasks.register('integrationTest', Test) {
  description = 'Runs postcode search integration tests (real Spring context, WireMock stands in for OS Places)'
  group = 'verification'
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  useJUnitPlatform()
  shouldRunAfter tasks.named('test')
  testLogging {
    events 'passed', 'skipped', 'failed'
    exceptionFormat = 'full'
  }
}

// Same duplicate-entry Gradle bug as processTestResources (gradle/gradle#17236), triggered once
// real files exist under src/integrationTest/resources.
tasks.named('processIntegrationTestResources') {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// PMD is not run on test code in this project (see gradle/pmd.gradle's pmdTest); apply the same
// policy to integration test sources.
tasks.named('pmdIntegrationTest') {
  enabled = false
}

tasks.named('check') { dependsOn tasks.named('integrationTest') }

// We MUST keep all dependencies in the build.gradle to allow dependabot to provide version updates
// Sadly, dependabot does not track dependencies in the apply-from files
dependencies {
  // Java core
  implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

  compileOnly 'org.projectlombok:lombok:1.18.48'
  annotationProcessor 'org.projectlombok:lombok:1.18.48'
  testCompileOnly 'org.projectlombok:lombok:1.18.48'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

  // Spring boot core
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-restclient'
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
  testImplementation('org.springframework.boot:spring-boot-starter-test') {
    exclude group: 'junit', module: 'junit'
    exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
  }

  // Address Lookup API contract (generated interfaces/models) - published from
  // api-cp-crime-address-lookup; this service implements AddressSearchApi.
  implementation 'uk.gov.hmcts.cp:api-cp-crime-address-lookup:0.0.1'
  // swagger-annotations is compileOnly in the contract jar (not published transitively), but its
  // generated interfaces reference these annotation classes - needed here to compile against them.
  compileOnly 'io.swagger.core.v3:swagger-annotations:2.2.55'
  testCompileOnly 'io.swagger.core.v3:swagger-annotations:2.2.55'

  // Integration tests: WireMock stands in for OS Places. The -standalone artifact shades its own
  // Jackson/Guava, so it can't clash with the app's own Jackson (Spring Boot 4/Jackson 3) on the
  // integrationTest classpath.
  integrationTestImplementation 'org.wiremock:wiremock-standalone:3.9.2'
  // Real HTTP round-trip against a randomly-bound embedded server, rather than MockMvc's
  // in-process dispatch simulation - TestRestTemplate moved to this module in Spring Boot 4.
  integrationTestImplementation 'org.springframework.boot:spring-boot-resttestclient'

  // --- Observability / Actuator / OTEL / Prometheus ---
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

  // Security: pin transitive tomcat-embed-core to patched version (CVE-2026-41293, -43512, et al.)
  // Brought in transitively via spring-boot-starter-web; >=11.0.0-M1,<11.0.22 are vulnerable
  implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'
}
