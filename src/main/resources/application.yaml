spring:
  application:
    name: cp-address-lookup-service
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/address-lookup-service}

os-places:
  client:
    base-url: ${OS_PLACES_BASE_URL:https://api.os.uk}
    api-key: ${OS_PLACES_API_KEY:}
    connect-timeout-ms: ${OS_PLACES_CONNECT_TIMEOUT_MS:3000}
    # SB-06: no Resilience4j TimeLimiter (it requires a CompletionStage-returning method, which
    # would need an async/executor layer purely to satisfy that) - this plain transport-level
    # timeout is the actual 10s budget. Trade-off: a genuinely slow-but-alive OS Places response
    # is no longer cut off early and deterministically at 10s - every caller waits out however
    # long OS Places actually takes, up to this timeout. Repeated hard failures (5xx, connection
    # failures) still trip the circuit breaker below exactly as before.
    read-timeout-ms: ${OS_PLACES_READ_TIMEOUT_MS:10000}
    # true only on OS-backed tiers (SIT/PRP/PRD) - set via Helm values per environment. Fixture
    # tiers (STE/DEV/NFT) leave this false, since they have no OS Places key at all.
    key-required: ${OS_PLACES_KEY_REQUIRED:false}

# SB-06: CircuitBreaker on the OS Places call (proven need: OS outage 2026-06-05/06) - open circuit
# answers degraded instantly, no OS Places call attempted. Only records availability failures
# (timeouts, connection failures, 5xx) - not upstream-rate-limit (429) or upstream-auth (401/403),
# since neither is a sign OS Places itself is down, and opening the circuit wouldn't help either
# case (every future call would fail identically regardless of circuit state). Matches the
# contract's own grouping: its OpenAPI examples pair upstream-timeout with circuit-open on the
# same endpoints, while upstream-rate-limit has its own separate example.
#
# No Resilience4j TimeLimiter here (see os-places.client.read-timeout-ms above for why) - the
# transport-level read-timeout is what actually bounds a single call now.
#
# record-exceptions is a strict allowlist - anything not listed here (HttpClientErrorException for
# 401/403/429, the generic RestClientException for malformed JSON, CallNotPermittedException) is
# simply never counted as a circuit-breaker failure, so no ignore-exceptions entry is needed (or
# safe to add): Spring's RestClientException hierarchy has HttpServerErrorException,
# HttpClientErrorException AND ResourceAccessException all extending the same RestClientException
# base, so an "ignore RestClientException" entry would - and during development, did - silently
# swallow every listed record-exceptions entry too, since ignore wins on overlap.
resilience4j:
  circuitbreaker:
    instances:
      osPlaces:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${OS_PLACES_CB_WINDOW_SIZE:20}
        minimum-number-of-calls: ${OS_PLACES_CB_MIN_CALLS:15}
        failure-rate-threshold: ${OS_PLACES_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${OS_PLACES_CB_WAIT_OPEN:30s}
        permitted-number-of-calls-in-half-open-state: ${OS_PLACES_CB_HALF_OPEN_CALLS:3}
        automatic-transition-from-open-to-half-open-enabled: true
        # Without this, management.health.circuitbreakers.enabled below turns on the health
        # indicator feature itself, but this specific instance still won't appear in it - its
        # default is false, and the indicator reports UNKNOWN with no details for zero
        # opted-in instances rather than reflecting this breaker's actual state.
        register-health-indicator: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

address-lookup:
  cache:
    ttl-minutes: ${ADDRESS_LOOKUP_CACHE_TTL_MINUTES:10}
    maximum-size: ${ADDRESS_LOOKUP_CACHE_MAX_SIZE:10000}

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups
      # No secrets in health details (this service is unauthenticated everywhere, by design -
      # see the OpenAPI spec's own description); ops need to see which component failed readiness.
      show-details: always
      group:
        readiness:
          include: readinessState,osPlacesKey
  health:
    circuitbreakers:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}

logging:
  level:
    root: INFO
